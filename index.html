<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0B0F16">
  <title>Ephemeral chat</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Chat">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <div id="update" class="update" role="status" hidden>
    <span data-t="A new version is available. Reloading keeps the room, but you get a new identity."></span>
    <button type="button" id="update-reload" class="primary" data-t="Reload"></button>
    <button type="button" id="update-later" data-t="Later"></button>
  </div>
  <main>
    <header class="hero">
      <img class="icon" src="/icon.svg" alt="" width="44" height="44">
      <div class="title">
        <h1 data-t="Ephemeral chat"></h1>
        <p id="status" class="status" role="status"><span class="dot" aria-hidden="true"></span><span id="status-text"></span></p>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="es">ES</button>
      </div>
      <button type="button" id="bell" class="help-btn" data-t-title="Notifications" aria-pressed="false">
        <svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <g class="bell-on"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></g>
          <g class="bell-off"><path d="M13.73 21a2 2 0 0 1-3.46 0"/><path d="M18.63 13A17.89 17.89 0 0 1 18 8"/><path d="M6.26 6.26A5.86 5.86 0 0 0 6 8c0 7-3 9-3 9h14"/><path d="M18 8a6 6 0 0 0-9.33-5"/><path d="M1 1l22 22"/></g>
        </svg>
      </button>
      <button type="button" id="help-btn" class="help-btn" data-t-title="Help" aria-haspopup="dialog">?</button>
    </header>

    <section id="bar" class="card">
      <div class="who">
        <span class="muted" data-t="Room:"></span> <b id="room-name"></b>
      </div>
      <div class="who">
        <span class="muted" data-t="You:"></span> <b id="me"></b>
      </div>
      <details id="people">
        <summary id="people-summary"></summary>
        <ul id="online"></ul>
      </details>
      <div class="actions">
        <button id="share" type="button" data-t="Copy link"></button>
        <button id="share-native" type="button" data-t="Share" hidden></button>
        <button id="qr-btn" type="button" data-t="QR code"></button>
        <button id="install" type="button" data-t="Install app" hidden></button>
        <button id="new" type="button" data-t="New room"></button>
      </div>
    </section>

    <ul id="log" class="card" aria-live="polite"></ul>

    <div id="typing" class="typing" aria-live="polite"></div>
    <div id="emoji-panel" class="card" hidden></div>
    <form id="form" autocomplete="off">
      <button id="emoji-btn" type="button" class="emoji-btn" data-t-title="Emoji" aria-expanded="false" aria-controls="emoji-panel">😊</button>
      <input id="text" type="text" maxlength="1000" data-t-placeholder="Type a message…" enterkeyhint="send">
      <button type="submit" class="primary" data-t="Send"></button>
    </form>

    <footer>
      <p data-t="No history: messages are only seen by whoever is in the room right now. Every visit creates a new identity."></p>
      <p><span data-t="Relay:"></span> <a id="relay-link" href="#"></a> ·
        <a href="https://github.com/rzazo24/nostr-ephemeral-chat" rel="noopener noreferrer" data-t="Source code"></a></p>
    </footer>
  </main>
  <dialog id="help" aria-labelledby="help-title">
    <div class="help-head"><h2 id="help-title" data-t="Help"></h2><button type="button" id="help-close" data-t="Close"></button></div>
    <h3 data-t="How it works"></h3>
    <p data-t="Every time you open the chat you get a brand-new random room and a brand-new identity (a random name like calm-otter-42)."></p>
    <p data-t="The room has a readable name (like quiet-harbor-42) that everyone in it sees. It is only a label: what gives access is the link."></p>
    <p data-t="Copy the link with “Copy link” and send it to whoever you want: everyone who opens it is in the same room."></p>
    <p data-t="“New room” leaves this room and starts another one with a different link."></p>
    <p data-t="Use “Share” (phones) or “QR code” to pass the link to someone next to you."></p>
    <h3 data-t="Privacy"></h3>
    <p data-t="Messages are encrypted with a key that lives in the part of the link after the #. Browsers never send that part to any server, so the relay only sees scrambled text."></p>
    <p data-t="The relay can still see that someone is connected, when they write and how much, but not what."></p>
    <p data-t="Anyone who has the link can read and write in the room, so share it only with people you trust. There is no way to remove someone: start a new room instead."></p>
    <h3 data-t="Nothing is stored"></h3>
    <p data-t="There is no history. You only see what is written while you are connected, and whoever joins later sees nothing from before."></p>
    <p data-t="Closing or reloading the tab gives you a new identity. Reloading keeps the room, because the room is in the link."></p>
    <h3 data-t="Reactions and emojis"></h3>
    <p data-t="Press ☺+ under a message to react with 👍 ❤️ 😂 😮 😢 or 🙏. Press your own reaction again to remove it. Like messages, reactions are not stored."></p>
    <p data-t="On a computer, the 😊 button next to the message box opens an emoji picker. On a phone, use your keyboard’s emojis."></p>
    <h3 data-t="Notifications, links and typing"></h3>
    <p data-t="The bell turns on a sound and, if your browser allows it, a notification when a message arrives while you are on another tab. Notifications never include the message text. The tab title always shows how many messages you have not seen."></p>
    <p data-t="Links in messages are clickable and open in a new tab. Check where they lead before opening them."></p>
    <p data-t="You can see when someone is typing just above the message box."></p>
    <h3 data-t="Install as an app"></h3>
    <p data-t="On iPhone: open the chat in Safari, tap Share and then “Add to Home Screen”. On Android and desktop Chrome or Edge, use the “Install app” button or the browser’s install option. Each time you open the app you get a new room and a new identity. Notifications on a phone only work in the installed app, and only while it is still running in the background: nothing is pushed to a closed app."></p>
    <h3 data-t="If something fails"></h3>
    <p data-t="If the status shows “offline”, the chat reconnects by itself. Messages written meanwhile are not sent."></p>
    <p data-t="The relay limits how fast you can send. If a message is rejected, the reason appears in the chat; wait a few seconds and try again."></p>
  </dialog>
  <dialog id="qr" aria-labelledby="qr-title">
    <div class="help-head"><h2 id="qr-title" data-t="QR code"></h2><button type="button" id="qr-close" data-t="Close"></button></div>
    <img id="qr-img" alt="" width="320" height="320">
    <p data-t="Scan it to join this room. Show it only to people next to you."></p>
  </dialog>
  <div id="palette" class="card" role="menu" hidden></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
