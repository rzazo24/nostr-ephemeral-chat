name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Unit tests, plus the end-to-end test against a public relay.
      - run: npm test
        env:
          RELAY_URL: wss://relay.hivescope.xyz
